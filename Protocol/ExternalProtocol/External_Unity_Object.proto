syntax = "proto3";

package External_Game_Protocol;
option csharp_namespace = "GameProtocol";

message UnityGameObject {
    uint32 object_id = 1;
    int32 object_type = 2;
    TransformInfo transform = 3;
}

message GameObjectMovementInfo {
    uint32 object_id = 1;
    TransformInfo transform = 2;
    uint32 state = 3;
}

message TransformInfo {
    Vector3 position = 1;
    oneof rotation {
        uint32 compressed_quat = 2; 
        float yaw_angle = 3;        
    }
}

message Vector3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

// movement_info.state: 0 = IDLE, 1 = WALK, 2 = RUN, 3 = (reserved), 4 = JUMP/FALL
// action_state: 0 = NONE, 1 = SHOOTING
message PlayerState {
    GameObjectMovementInfo movement_info = 1; // object_id + transform(position, yaw) + state
    float pitch = 2;                          // 무기 조준 수직 각도
    Vector3 velocity = 3;                     // 보간용 속도 벡터
    uint32 action_state = 4;                  // 행동 상태 (이동 상태와 독립)
}

message InventoryItemInfo {
    uint32 blueprint_id = 1;
    uint64 instance_uid = 2;
    uint32 item_type    = 3;
    int32  quantity     = 4;
}

message InventorySlot {
    int32             slot_index = 1;
    InventoryItemInfo item       = 2;
}