syntax = "proto3";

package External_Game_Protocol;
option csharp_namespace = "GameProtocol";

message UnityGameObject {
    uint32 object_id = 1;
    uint32 object_type = 2;
    Vector3 position = 3;
    //Vector3 rotation = 4;
}

message GameObjectMovementInfo {
    uint32 object_id = 1;
    Vector3 position = 2;
    Vector3 front = 3;
    Vector3 velocity = 4;
    uint32 state = 5;
}

message Vector3 {
    float x = 1;
    float y = 2;
    float z = 3;
}