syntax = "proto3";

import "External_Unity_Object.proto";

package External_Game_Protocol;
option csharp_namespace = "GameProtocol";

// ============================================================================
// [작업사항] 클라이언트 반영 대상 — 2026-08-12 이후 서버 변경분
//
// 이 파일의 "[작업사항]" 으로 시작하는 주석은 클라이언트 작업 지시용 임시 주석이다.
// 클라이언트 반영이 끝나면 "[작업사항]" 블록만 일괄 삭제할 것 (그 외 주석은 유지).
//
// ── 공통 사항 (특정 패킷에 매이지 않는 변경) ────────────────────────────────
//
// (1) PktId 36~41 이 이번에 추가되었다.
//     36~40 은 서버가 이전부터 이 값으로 송수신하고 있었으나 .proto 의 enum PktId 에 빠져 있던 것이고,
//     41 은 신규 패킷이다. 기존 0~35 의 값은 하나도 바뀌지 않았으므로 기존 분기는 손댈 필요 없다.
//       36 D2C_NOTIFY_SPAWN_OBJECT
//       37 D2C_NOTIFY_WEAPON_CHANGED
//       38 C2D_REQUEST_SWITCH_WEAPON
//       39 D2C_NOTIFY_DESPAWN_OBJECT
//       40 D2C_NOTIFY_PLAYER_KILLED
//       41 D2C_NOTIFY_OBJECT_KILLED
//
// (2) UDP 헤더 timestampEcho 가 끊김 판정의 유일한 근거가 되었다. (필수 대응)
//     - 기존: reliable 재전송이 10회 연속 실패하면 끊김으로 간주 → 이 판정은 삭제되었다.
//             이제 서버의 reliable 재전송에는 횟수 제한이 없다.
//     - 변경: 클라이언트가 마지막으로 되돌려준 서버 timestamp 가 6초 이상 갱신되지 않으면
//             서버가 그 세션을 DISCONNECTED 로 강제 이탈시킨다(인벤토리 소실 포함).
//     - 클라이언트는 수신 패킷의 헤더 timestamp 를 보관했다가, 자신이 보내는 모든 패킷의
//       헤더 timestampEcho 에 그 값을 그대로 실어 되돌려줘야 한다.
//       (서버 시계 도메인의 값이므로 클라이언트가 가공하면 안 된다)
//     - 현재는 timestampEcho == 0 인 세션을 판정에서 제외하고 있으나 이는 과도기 임시 조치다.
//       0 을 계속 보내면 RTT 측정도 함께 무력화되므로 의존하지 말 것.
//
// (3) UnityGameObject.object_type 에 값 3 = Corpse(시신 컨테이너) 가 추가되었다.
//     .proto 상 타입은 그대로 int32 지만 클라이언트의 오브젝트 타입 매핑에 3번을 추가해야 한다.
//     시신은 플레이어 사망 시 그 자리에 스폰되는 동적 오브젝트이며,
//     사망자의 인벤토리·장착·탄창이 전부 이 컨테이너로 옮겨진다.
//     스폰은 D2CNotifySpawnObject 로 통보되고, 열고 집는 조작은 일반 컨테이너와 동일하다
//     (C2DRequestOpenContainer / C2DRequestInteractContainerObject).
//
// (4) 실드 재생이 구현되었으나 전용 통보 패킷은 없다. (클라이언트 로컬 예측 필요)
//     서버는 매 틱 실드를 회복시키기만 하고 어떤 패킷도 보내지 않는다.
//     D2CNotifyHealthChange 는 여전히 피격 시에만 온다.
//     자기 실드 게이지는 클라이언트가 자기 방어구 ArmorSpec 의 초당 재생량으로 예측할 것.
//     서버 규칙: (재생량 x 경과ms) 를 누적해 1000 이 될 때마다 1 회복, 최대치 상한, 사망 시 중단.
//     방어구를 새로 착용하면 실드는 0 에서 시작한다(재생으로만 채워진다. 의도된 설계).
//     남의 실드·HP·방어구는 어떤 패킷으로도 오지 않는다.
//
// (5) '손에 든 무기' 추적은 여러 패킷에 걸쳐 있다. 아래를 한 묶음으로 보고 구현할 것.
//     - 남의 무기 : D2CSpawnPlayerObject.weapon_id 가 초기값, 이후 D2CNotifyWeaponChanged 로 갱신.
//     - 내 무기   : C2DRequestSwitchWeapon 의 결과가 성공·거부 모두 D2CNotifyWeaponChanged 로 온다.
//                   단, 장착(C2DRequestEquipItem)으로 손에 든 슬롯이 바뀌는 경우는 통보가 없어
//                   클라이언트가 서버 규칙대로 직접 반영해야 한다(해당 패킷 주석 참고).
//     - 발사      : C2DRequestWeaponFire.weapon_dbid 가 손에 든 무기와 다르면 조용히 버려진다.
//
// (6) 사망해도 세션이 즉시 끊기지 않고 5초의 유예 구간이 생겼다. (클라이언트 신규 대응 필요)
//     목적은 급격한 씬 전환을 막는 것 하나이며, 조작이나 결과를 되돌릴 기회가 아니다.
//     - 기점 : D2CNotifyPlayerKilled 의 victim_object_id 가 자기 objectId 인 것.
//     - 유예 중 서버가 계속 보내는 것 : 룸 브로드캐스트 전부.
//       타 플레이어 이동(D2CUpdatePlayerStates), 발사(D2CBroadcastWeaponFire),
//       오브젝트 스폰·디스폰, 킬 피드가 그대로 도착하므로 관전 화면을 유지할 수 있다.
//     - 유예 중 클라이언트 요청 : C2DHeartBeat 를 제외한 전부가 응답 없이 버려진다.
//       사격·무기 교체·장착·귀환·컨테이너 조작 어느 것도 처리되지 않는다.
//       (하트비트만 여는 이유는 클라이언트가 접속 끊김으로 오판하지 않게 하기 위함이다)
//     - 5초가 지나면 서버가 세션을 정리하고 하향 트래픽이 끊긴다.
//       유예 시간은 패킷으로 알려주지 않으므로 5000ms 를 클라이언트 상수로 둘 것.
//       그 안에 씬을 정리하고 로비로 돌아가는 것이 클라이언트 몫이다.
//     - 게임 결과는 사망하는 순간 이미 확정된다. 인벤토리 소실과 시신 컨테이너 스폰이
//       그 시점에 끝나므로 유예 중 연결을 끊어도 결과는 달라지지 않는다.
//       인벤토리 DB 반영과 매칭 락 해제도 유예를 기다리지 않고 이때 시작되므로,
//       5초를 쓰고 로비로 돌아오면 재매칭이 준비된 상태다. 다만 반영은 비동기라,
//       유예를 다 쓰지 않고 즉시 재매칭을 거는 UI 라면 409 응답을 실패로 표시하지 말고
//       잠시 후 재시도하도록 처리할 것.
//     - 자기 캐릭터의 D2CDespawnPlayerObject 는 오지 않는다(해당 패킷 주석 참고).
//       유예 동안 자기 캐릭터를 화면에 남겨두고 사망 연출을 재생하면 된다.
// ============================================================================

enum PktId {
    C2D_CHANNEL_OPEN = 0;
    D2C_RESPONSE_CHANNEL_OPEN = 1;
    C2D_HEART_BEAT = 2;
    D2C_HEART_BEAT = 3;
    C2D_REQUEST_BLUEPRINT = 4;
    D2C_RESPONSE_BLUEPRINT_STATIC_OBJECTS = 5;
    C2D_REQUEST_SPAWN_ME = 6;
    D2C_RESPONSE_SPAWN_ME_SPAWN_SPOT = 7;
    D2C_RESPONSE_SPAWN_ME_DYNAMIC_OBJECTS = 8;
    C2D_REQUEST_SPAWN_BY_OBJECT_ID = 9;
    D2C_RESPONSE_SPAWN_BY_OBJECT_ID = 10;
    C2D_UPDATE_PLAYER_STATE = 11;
    C2D_REQUEST_SPAWN_PLAYER_OBJECTS = 12;
    D2C_SPAWN_PLAYER_OBJECT = 13;
    D2C_SPAWN_PLAYER_OBJECTS = 14;
    D2C_UPDATE_PLAYER_STATES = 15;
    C2D_NOTIFY_LOADING_COMPLETE = 16;
    D2C_FULL_INVENTORY_SYNC = 17;
    C2D_REQUEST_OPEN_CONTAINER = 18;
    D2C_RESPONSE_OPEN_CONTAINER = 19;
    C2D_CLOSE_CONTAINER = 20;
    C2D_REQUEST_INTERACT_CONTAINER_OBJECT = 21;
    D2C_RESPONSE_INTERACT_CONTAINER_OBJECT = 22;
    C2D_REQUEST_EQUIP_ITEM = 23;
    D2C_RESPONSE_EQUIP_ITEM = 24;
    D2C_RESPONSE_INTERACT_CONTAINER_OBJECT_DENY = 25;
    D2C_RESPONSE_EQUIP_ITEM_DENY = 26;
    C2D_REQUEST_RECENT_INVENTORY_INFO = 27;
    D2C_RESPONSE_RECENT_CONTAINER_INFO = 28;
    C2D_REQUEST_WEAPON_FIRE = 29;
    D2C_BROADCAST_WEAPON_FIRE = 30;
    D2C_NOTIFY_HEALTH_CHANGE = 31;
    C2D_REQUEST_RECALL = 32;
    D2C_RESPONSE_RECALL = 33;
    D2C_NOTIFY_RECALL_RESULT = 34;
    D2C_DESPAWN_PLAYER_OBJECT = 35;
    D2C_NOTIFY_SPAWN_OBJECT = 36;
    D2C_NOTIFY_WEAPON_CHANGED = 37;
    C2D_REQUEST_SWITCH_WEAPON = 38;
    D2C_NOTIFY_DESPAWN_OBJECT = 39;
    D2C_NOTIFY_PLAYER_KILLED = 40;
    D2C_NOTIFY_OBJECT_KILLED = 41;
    C2D_REQUEST_RELOAD = 42;
    D2C_RESPONSE_RELOAD = 43;
}

message C2DChannelOpen {
    string echo = 1;
}

message D2CResponseChannelOpen {
    string echo = 1;
}

message C2DHeartBeat {

}

message D2CHeartBeat {

}

message C2DRequestBlueprint {
    
}

message D2CResponseBlueprintStaticObjects {
    uint32 index = 1;
    bool is_last = 2;
    repeated UnityGameObject ingame_objects = 3;
}

message C2DRequestSpawnMe {
    
}

message D2CResponseSpawnMeSpawnSpot {
    Vector3 spawn_point    = 1;
    int32   character_type = 2;
    uint32  object_id      = 3;
}

message D2CResponseSpawnMeDynamicObjects {
    uint32 index = 1;
    bool is_last = 2;
    repeated UnityGameObject ingame_objects = 3;
}

message C2DRequestSpawnByObjectId {
    int32 object_id = 1;
}

message D2CResponseSpawnByObjectId {
    UnityGameObject game_object = 1;
}

// [작업사항] 신규 (PktId 36, reliable) — 클라이언트 신규 구현 필요
//   지금까지 오브젝트는 입장 시 일괄 수신(D2CResponseBlueprintStaticObjects /
//   D2CResponseSpawnMeDynamicObjects)하거나 클라이언트가 물어보는(C2DRequestSpawnByObjectId)
//   방식뿐이었다. 이제 게임 도중 생긴 오브젝트가 질의 없이 서버 push 로 도착한다.
//   현재 이 경로로 오는 것: 시신 컨테이너(object_type=3), 그 외 런타임 스폰 오브젝트 전부.
//   페이로드 구조는 D2CResponseSpawnByObjectId 와 동일하므로 스폰 처리 코드는 재사용 가능하다.
//   같은 objectId 가 중복 도착할 수 있으니 이미 있는 오브젝트면 무시할 것.
// 게임 도중 생성된 비플레이어 오브젝트의 스폰 통보 (서버 push).
// 컨테이너처럼 스스로 아무 행동도 발생시키지 않는 오브젝트는 클라이언트가 그 objectId 를
// 참조할 계기가 없어 되물을 수조차 없다 — 이 통보가 유일한 인지 수단이므로 reliable.
// 페이로드는 D2CResponseSpawnByObjectId 와 같지만 질의 응답과 구분하려 별도 패킷으로 둔다.
message D2CNotifySpawnObject {
    UnityGameObject game_object = 1;
}

message C2DUpdatePlayerState {
    PlayerState state = 1;
}

message C2DRequestSpawnPlayerObjects {

}

// [작업사항] 필드 변경 없음 / 수신 시점이 바뀜 — 클라이언트 대응 필요
//   기존에는 C2DRequestSpawnPlayerObjects 의 응답(D2CSpawnPlayerObjects)으로만 받았다.
//   이제 다른 플레이어가 스폰하는 순간 이 패킷 1개가 질의 없이 서버 push 로 도착한다
//   (본인은 제외 — 본인은 D2CResponseSpawnMeSpawnSpot 으로 이미 받는다).
//   weapon_id 는 예전부터 있던 필드지만 이제 실제 값이 채워져 온다.
//   스폰 시점의 '손에 든 무기' blueprint_id 이며(0=맨손), 이후 변경은
//   D2CNotifyWeaponChanged 로만 통보되므로 두 패킷을 함께 추적해야 남의 무기 외형이 맞는다.
message D2CSpawnPlayerObject {
    int32           character_type = 1;
    UnityGameObject game_object    = 2;
    int32           weapon_id      = 3;
}

message D2CSpawnPlayerObjects {
    repeated D2CSpawnPlayerObject players = 1;
}

// [작업사항] 스펙 변경 없음 / 버그 수정 — 클라이언트 확인만 필요
//   윈체스터 맵의 룸이 이 패킷을 아예 브로드캐스트하지 않던 문제를 고쳤다.
//   테스트 맵에서만 되던 타 플레이어 이동 동기화가 이제 두 맵 모두 동일하게 동작한다.
//   실드 값은 이 패킷에 실리지 않는다(PlayerState 에 없음). 공통 사항 (4) 참고.
message D2CUpdatePlayerStates {
    repeated PlayerState player_states = 1;
}

message C2DNotifyLoadingComplete {

}

message D2CFullInventorySync {
    uint32              inventory_version = 1;
    repeated InventorySlot inventory_slots = 2;
    InventorySlot       primary_weapon    = 3;
    InventorySlot       secondary_weapon  = 4;
    InventorySlot       armor             = 5;
    InventorySlot       primary_weapon_magazine   = 6;
    InventorySlot       secondary_weapon_magazine = 7;
}

message C2DRequestOpenContainer {
    uint32 container_object_id = 1;
}

message D2CResponseOpenContainer {
    uint32 container_object_id = 1;
    uint32 container_version = 2;
    uint32 container_volume = 3;
    repeated InventorySlot container_slots = 4;
}

message C2DCloseContainer {

}

message C2DRequestInteractContainerObject {
    uint32 interact_type                  = 1; // 0=get, 1=swap, 2=merge
    uint32 start_object_id                = 2;
    uint32 start_object_inventory_version = 3;
    uint32 start_object_slot_idx          = 4;
    int32  quantity                        = 5;
    uint32 end_object_id                  = 6;
    uint32 end_object_inventory_version   = 7;
    uint32 end_object_slot_idx            = 8;
}

message D2CResponseInteractContainerObject {
    uint32 interact_type                  = 1; // 0=get, 1=swap, 2=merge
    uint32 start_object_id                = 2;
    uint32 start_object_inventory_version = 3;
    uint32 start_object_slot_idx          = 4;
    int32  quantity                        = 5;
    uint32 end_object_id                  = 6;
    uint32 end_object_inventory_version   = 7;
    uint32 end_object_slot_idx            = 8;
}

// [작업사항] 요청/응답 스펙은 그대로 / 부수 통보가 추가됨 — 클라이언트 대응 필요
//   무기 슬롯(equipment_slot_type 0 또는 1) 조작이 성공하면 서버가 결과를
//   PlayerObject 에 반영하고, 같은 룸의 '나머지' 플레이어에게 D2CNotifyWeaponChanged 를
//   추가로 보낸다. 요청자 본인은 기존대로 D2CResponseEquipItem 만 받는다(중복 없음).
//   따라서 이 조작으로 '손에 든 슬롯' 이 바뀌는 경우는 본인이 통보를 받지 못하므로
//   클라이언트가 서버 규칙대로 직접 반영해야 한다. 규칙은 '들고 있던 슬롯이 비었을 때만
//   반대쪽으로 옮긴다' 이며(양쪽 다 비면 맨손), 그 외의 장착 조작은 손에 든 슬롯을 바꾸지 않는다.
//   방어구 슬롯(2)은 서버 내부의 실드 스탯만 갱신하고 아무에게도 통보하지 않는다.
//   따라서 남의 방어구 착용 여부·종류는 어떤 패킷으로도 알 수 없다(의도된 설계).
//   주의: 방어구를 새로 착용하면 현재 실드가 0 으로 초기화된다. 본인 UI 는 이 시점에
//         실드 게이지를 0 으로 떨어뜨리고 재생 예측을 다시 시작해야 한다(전용 통보 없음).
message C2DRequestEquipItem {
    uint32 action_type                  = 1; // 0=equip, 1=unequip
    uint32 equipment_slot_type          = 2; // 0=primary_weapon, 1=secondary_weapon, 2=armor
    uint32 object_id                    = 3; // 0xFFFFFFFF=player inventory, else=container
    uint32 object_inventory_version     = 4; // object_id가 0xFFFFFFFF이면 플레이어 인벤토리 버전, 아니면 컨테이너 버전
    uint32 object_slot_idx              = 5;
    uint32 my_inventory_version         = 6; // object_id가 컨테이너일 때만 유효: 플레이어 자신의 인벤토리 버전
}

message D2CResponseEquipItem {
    uint32 action_type                = 1;
    uint32 equipment_slot_type        = 2;
    uint32 object_id                  = 3;
    uint32 object_inventory_version   = 4; // object_id가 0xFFFFFFFF이면 플레이어 인벤토리 버전, 아니면 컨테이너 버전
    uint32 object_slot_idx            = 5;
    uint32 my_inventory_version       = 6; // object_id가 컨테이너일 때만 유효: 갱신된 플레이어 인벤토리 버전
}

message D2CResponseInteractContainerObjectDeny {
    uint32 deny_reason_mask = 1;
    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH      인벤토리/컨테이너 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY            소스 슬롯이 비어 있음
    // 0x0004  DENY_SLOT_NOT_EMPTY        대상 슬롯이 비어 있지 않음 (get 타입)
    // 0x0008  DENY_SLOT_ALREADY_EMPTY    슬롯이 이미 비어 있음 (swap/merge 타입)
    // 0x0010  DENY_INVALID_QUANTITY      수량이 유효하지 않음
    // 0x0020  DENY_BLUEPRINT_MISMATCH    블루프린트 ID 불일치 (merge 타입)
    // 0x0040  DENY_ITEM_TYPE_MISMATCH    아이템 타입 불일치 (merge 타입)
    // 0x0200  DENY_SERVER_INTERNAL       서버 내부 오류
}

message D2CResponseEquipItemDeny {
    uint32 deny_reason_mask = 1;
    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH       인벤토리/컨테이너 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY             소스 슬롯이 비어 있음
    // 0x0040  DENY_ITEM_TYPE_MISMATCH     아이템 타입 불일치 (예: 장갑 슬롯에 무기)
    // 0x0080  DENY_BARE_HANDED            마지막 무기를 내릴 수 없음 (맨손 방지)
    // 0x0100  DENY_MAGAZINE_UNLOAD_FAILED 탄창 언로드 실패
    // 0x0200  DENY_SERVER_INTERNAL        서버 내부 오류
}

// [작업사항] 신규 (PktId 37, reliable) — 클라이언트 신규 구현 필요
//   ※ 이름과 필드가 두 번 바뀌었다. 이전 스펙을 이미 받아갔다면 재작업할 것.
//     (구1) D2CNotifyEquipmentChanged { object_id, weapon_id, armor_id }
//     (구2) D2CNotifyWeaponChanged    { object_id, weapon_id }
//     (신)  D2CNotifyWeaponChanged    { object_id, weapon_id, slot, inventory_version }
//     armor_id 는 삭제되었다 — 방어구는 외형에 드러나지 않아 남이 알 이유가 없고,
//     blueprint_id 하나가 ArmorSpec(최대 실드·피해 감소율·재생량) 전체와 동치라 수치 노출이 된다.
//     slot / inventory_version 이 추가되었다 — 주무기와 보조무기에 같은 총을 들면
//     weapon_id 만으로는 서버가 어느 슬롯을 든 상태인지 구분되지 않았고,
//     교체가 거부됐을 때 그 사유가 '인벤토리 버전이 낡음' 인지 알 수 없어
//     클라이언트가 재동기화를 시작할 트리거가 없었다.
//   도착 경로는 두 가지다.
//     1) 남의 무기 변경 통보 — 장착(C2DRequestEquipItem 성공) 또는 무기 교체
//        (C2DRequestSwitchWeapon 성공) 시 그 플레이어를 제외한 룸 전체에 온다.
//        이 경우 inventory_version 은 항상 0xFFFFFFFF 다(남의 인벤토리 버전은 주지 않는다).
//     2) 자기 자신에게 오는 무기 교체 결과 — C2DRequestSwitchWeapon 의 성공·거부 양쪽 모두
//        요청자에게 이 패킷 하나로 돌아오며 inventory_version 에 서버의 현재 값이 담긴다.
//        ※ 이전 스펙은 '본인에게 오면 거부' 였으나 이제는 성공도 본인에게 온다.
//          object_id 로 성공/실패를 판정하면 안 된다 — 판정법은 C2DRequestSwitchWeapon 주석 참고.
//   weapon_id 는 손에 든 무기의 blueprint_id 이며 0 은 맨손을 뜻한다.
// 손에 든 무기 변경 통보. 남의 변경은 당사자를 제외한 룸 전체에, 본인의 교체 결과는 본인에게 온다.
// 방어구는 싣지 않는다 — 외형에 드러나지 않으므로 남이 알 이유가 없고,
// blueprint_id 하나가 ArmorSpec(최대 실드·피해 감소율·재생량) 전체와 동치라 곧 수치 노출이 된다.
message D2CNotifyWeaponChanged {
    uint32 object_id         = 1;
    uint32 weapon_id         = 2;  // 손에 든 무기 blueprint_id (0=맨손). D2CSpawnPlayerObject.weapon_id 와 같은 의미
    uint32 slot              = 3;  // 손에 든 슬롯 (0=주무기, 1=보조무기). 주/보조가 같은 무기면 weapon_id 로는 구분되지 않는다
    // 서버가 보는 수신자 본인의 인벤토리 버전. 남의 변경 통보에는 0xFFFFFFFF 가 온다 —
    // 0 은 실재하는 버전이므로(세션 시작값) '미설정' 으로 해석하면 안 된다
    uint32 inventory_version = 4;
}

message C2DRequestRecentInventoryInfo {
    uint32 object_id = 1; // 0xFFFFFFFF=player inventory, else=container
}

message D2CResponseRecentContainerInfo {
    uint32 container_object_id = 1;
    uint32 container_version = 2;
    uint32 container_volume = 3;
    repeated InventorySlot container_slots = 4;
}

// [작업사항] 신규 (PktId 38, reliable) — 클라이언트 신규 구현 필요
//   주무기/보조무기 전환 요청. 지금까지 클라이언트에서 무기 전환을 보낼 경로가 없었다.
//   target_slot 은 '토글' 이 아니라 절대 지정이다(0=주무기, 1=보조무기).
//   중복 전송이나 순서 역전이 일어나도 결과가 같으므로 그대로 재전송해도 안전하다.
//   my_inventory_version 은 장착 조작과의 순서 역전을 막기 위한 것으로,
//   가장 최근에 서버로부터 받은 플레이어 인벤토리 버전을 넣는다.
//   결과는 성공·거부 모두 D2CNotifyWeaponChanged 하나로 돌아온다. 전용 거부 패킷은 없다.
//     성공 → 요청자 본인 + 룸의 나머지 전체. 본인에게 오는 것에만 inventory_version 이 채워진다.
//     거부 → 요청자에게만. 담긴 값은 '서버가 보는 현재 무기' 다.
//   거부 조건은 target_slot 이 0/1 이 아님, 인벤토리 버전 불일치, 대상 슬롯이 비어 있음 셋이다.
//   본인 objectId 로 도착한 통보의 판정:
//     slot == 보낸 target_slot                        → 성공
//     slot != target_slot && inventory_version 불일치 → 인벤토리 버전이 낡아 거부됨.
//                                                       C2DRequestRecentInventoryInfo(0xFFFFFFFF) 로
//                                                       재동기화한 뒤 새 버전으로 재요청할 것.
//     slot != target_slot && inventory_version 일치   → 대상 슬롯이 비었거나 target_slot 이 0/1 이 아님.
//                                                       재요청해도 결과가 같으므로 UI 만 되돌릴 것.
//   어느 경우든 도착한 weapon_id/slot 이 서버 권위값이므로 예측은 항상 이 값으로 맞춘다.
//   주의 1 — 응답의 순서 역전. reliable 채널은 전달과 중복 제거만 보장하고 순서는 보장하지 않는다.
//     교체 요청을 연달아 보내면 통보가 역순으로 도착해 낡은 무기가 적용될 수 있다.
//     마지막으로 반영한 D2CNotifyWeaponChanged 의 UDP 헤더 rSeqNum 을 기억해두고
//     그보다 낮은 rSeqNum 으로 온 통보는 버릴 것.
//   주의 2 — 교체 확정 전에는 발사 트리거를 막을 것. reliable 과 unreliable 채널 사이에도
//     순서 보장이 없어 사격이 교체보다 먼저 처리되면 weapon_dbid 불일치로 조용히 버려진다.
// 손에 드는 무기 교체. 토글이 아니라 절대 지정이라 재전송·순서 역전에도 결과가 같다.
// 결과는 성공·거부 모두 D2CNotifyWeaponChanged 로 돌아온다 (거부는 요청자에게만).
message C2DRequestSwitchWeapon {
    uint32 target_slot          = 1;  // 0=주무기, 1=보조무기
    uint32 my_inventory_version = 2;  // 장착 조작과의 순서 역전 차단
}

// [작업사항] 스펙 변경 없음 / 서버 처리 범위가 넓어짐 — 클라이언트 조준 판정 확인 필요
//   기존에는 hit_object_id 가 '플레이어' 일 때만 데미지가 들어갔다.
//   이제 전투 가능한 비플레이어 오브젝트도 피격 대상이 된다(HP 를 가진 오브젝트 전부).
//   따라서 클라이언트의 Raycast 는 플레이어가 아닌 오브젝트의 objectId 도 그대로 실어 보내면 된다.
//   맞은 대상별 결과:
//     - 플레이어  : 피해자에게 D2CNotifyHealthChange, 죽으면 D2CNotifyPlayerKilled +
//                   D2CDespawnPlayerObject 가 이어진다.
//     - 비플레이어: 죽으면 D2CNotifyDespawnObject 로 제거가 통보된다(HP 통보는 없다).
//   weapon_dbid 검증은 기존과 동일하며, 불일치 시 발사는 무시된다.
//   weapon_dbid 는 '장착한' 무기가 아니라 '손에 든' 무기여야 한다. 무기 교체 직후에는
//   D2CNotifyWeaponChanged 로 확정된 weapon_id 를 쓸 것 (C2DRequestSwitchWeapon 주석 참고).
//
// [작업사항] fire_sequence 판정 규칙 변경 — 클라이언트 계약 확인 필요
//   기존에는 서버 기대값과 '완전히 같을 때만' 수락했다. 발사는 unreliable 이라 재전송이
//   없고, uSeqNum 은 이동 패킷과 공유되어 재정렬만으로도 발사 한 장이 드롭된다.
//   그 한 장 때문에 이후 모든 발사가 영구히 거부되던 것을 고쳤다.
//   새 규칙 : 서버 기대값보다 '작으면' 거부, 같거나 크면 수락하고 기대값을 그 다음 값으로 옮긴다.
//   따라서 유실·재정렬로 번호가 건너뛰는 것은 정상이며 서버가 알아서 따라붙는다.
//   클라이언트가 지킬 것 두 가지 — 이미 만족하고 있으나 깨뜨리지 말 것:
//     - 발사할 때마다 무조건 증가시킬 것. 유실을 감지했다고 되돌리거나 재사용하지 말 것.
//     - 되돌린 번호는 '낡은 시퀀스' 로 거부된다. 복구는 D2CResponseReload.fire_sequence 로만
//       가능하므로, 그때까지 그 무기의 발사는 계속 거부된다.
message C2DRequestWeaponFire {
    // 단조 증가하기만 하면 되고 연속일 필요는 없다. 되돌아온 값은 리플레이로 간주해 거부된다
    uint32  fire_sequence  = 1;  // 발사 시퀀스 번호
    uint32  weapon_dbid    = 2;  // 손에 든 총기의 blueprint_id
    Vector3 hit_point      = 3;  // Raycast 피격 좌표 (빗나간 경우 미설정)
    uint32  hit_object_id  = 4;  // 피격 대상 object_id (없으면 0xFFFFFFFF)
}

message D2CBroadcastWeaponFire {
    uint32  shooter_object_id = 1;  // 발사자 object_id
    Vector3 hit_point         = 2;  // 탄착 좌표 (없으면 미설정 — 이펙트 불필요)
}

enum HealthChangeReason {
    REASON_UNKNOWN    = 0;
    REASON_WEAPON_HIT = 1;  // 총기 피격
    REASON_ITEM_HEAL  = 2;  // 아이템 회복
}

// [작업사항] 필드 추가 — 클라이언트 대응 필요
//   attacker_object_id (4번) 가 추가되었다. 나머지 필드는 그대로다.
//   이 패킷은 여전히 '피해를 입은 본인' 에게만 온다(남의 HP·실드는 브로드캐스트하지 않는다).
//   attacker_object_id 로 피격 방향 표시와 교전 상대 추적을 할 수 있다.
//   사망 확정과 킬러 표기는 이 패킷이 아니라 D2CNotifyPlayerKilled 를 기점으로 삼을 것
//   (피해자 본인도 그 패킷을 받으며, 거기서부터 5초 유예가 시작된다 — 공통 사항 (6)).
//   가해자가 없는 변화(회복 등)는 0 이 아니라 0xFFFFFFFF 로 온다.
//   0 은 실재하는 objectId 이므로 '미설정' 으로 해석하면 안 된다.
//   현재 이 패킷이 발생하는 경로는 총기 피격(REASON_WEAPON_HIT) 하나뿐이다.
//   실드 재생은 이 패킷을 발생시키지 않는다 — 공통 사항 (4) 참고.
message D2CNotifyHealthChange {
    int32              health_point       = 1;  // 현재 HP (절대값)
    int32              shield_point       = 2;  // 현재 쉴드 (절대값)
    HealthChangeReason reason             = 3;  // 변화 원인
    // 가해자 object_id. 가해자가 없으면(회복 등) 0xFFFFFFFF 를 반드시 명시할 것 —
    // proto3 기본값 0 은 실재하는 object_id 라 미설정이 곧 오귀속이 된다
    uint32             attacker_object_id = 4;
}

// [작업사항] 스펙 변경 없음 / 의미가 바뀜 — 클라이언트 대응 필요
//   D2CResponseRecall(result=true) 는 더 이상 '귀환 완료' 가 아니라 '귀환 시작 승인' 이다.
//   승인 후 서버가 1초 간격으로 5회 유지 검사를 하고, 최종 결과는 D2CNotifyRecallResult 로 온다.
//   클라이언트는 승인 시점에 5초짜리 귀환 진행 연출을 띄우고, 완료/취소는 그 패킷으로 확정할 것.
//   진행 중에 다시 C2DRequestRecall 을 보내면 서버가 조용히 무시한다(응답이 오지 않으므로
//   응답 대기 상태로 두면 안 된다). 진행 중 취소를 보낼 요청 패킷은 아직 없다.
//   result=false 는 즉시 거부이며, 사유는 '해당 인덱스의 귀환 영역 안에 있지 않음' 하나뿐이다
//   (인덱스 범위 밖도 여기 포함된다).
message C2DRequestRecall {
    uint32 recall_spot_index = 1;  // 귀환 스팟 인덱스 (맵별 귀환 영역 테이블의 인덱스)
}

message D2CResponseRecall {
    bool   result            = 1;  // true=귀환 승인, false=거부
    uint32 recall_spot_index = 2;  // 요청 인덱스 에코 (어느 요청에 대한 응답인지 대조용)
}

// [작업사항] 신규 (PktId 34, reliable) — 클라이언트 신규 구현 필요
//   귀환의 최종 결과. D2CResponseRecall(result=true) 이후 반드시 한 번 온다.
//   성공(result=true)은 승인 시점으로부터 약 5초 뒤, 취소(result=false)는 검사 실패 즉시 온다.
//   recall_spot_index 는 요청 인덱스 에코이므로 진행 중이던 연출과 대조해 쓸 것.
//   reason 별 클라이언트 처리:
//     RECALL_RESULT_SUCCESS         귀환 성공 → 매치 종료 화면으로. 이 세션은 곧 끊긴다.
//     RECALL_RESULT_OUT_OF_ZONE     영역 이탈 → 연출 취소, 다시 요청 가능.
//     RECALL_RESULT_PLAYER_DEAD     진행 중 사망 → 사망 처리가 우선한다.
//     RECALL_RESULT_SESSION_LOST    세션 이탈 확정 → 재요청 불가.
//     RECALL_RESULT_SERVER_INTERNAL 서버 내부 오류 → 연출 취소.
//   성공 시 서버는 이 통보가 ACK 되기를 기다렸다가(최대 3초) 세션을 정리한다.
//   인벤토리 반출 자체는 ACK 와 무관하게 귀환 성공 시점에 확정되므로, ACK 는 세션이
//   언제 끊기느냐만 좌우한다(늦어도 3초 뒤에는 끊긴다).
// 귀환 승인 후 진행(1초 간격 5회 검사)의 최종 결과 사유
enum RecallResultReason {
    RECALL_RESULT_UNKNOWN         = 0;
    RECALL_RESULT_SUCCESS         = 1;  // 5회 검사 전부 통과 — 귀환 성공
    RECALL_RESULT_OUT_OF_ZONE     = 2;  // 진행 중 귀환 영역 이탈
    RECALL_RESULT_PLAYER_DEAD     = 3;  // 진행 중 사망
    RECALL_RESULT_SESSION_LOST    = 4;  // 세션이 INPLAY 상태를 벗어남
    RECALL_RESULT_SERVER_INTERNAL = 5;  // 룸/오브젝트 조회 실패 등 서버 내부 오류
}

// D2CResponseRecall(result=true) 로 승인된 귀환의 최종 결과 통보.
// 승인 시점부터 5초 뒤(1초 간격 5회 검사 통과)에 성공이, 검사 실패 시점에 취소가 전송된다.
message D2CNotifyRecallResult {
    bool               result            = 1;  // true=귀환 성공, false=귀환 취소
    uint32             recall_spot_index = 2;  // 요청 인덱스 에코 (어느 요청에 대한 결과인지 대조용)
    RecallResultReason reason            = 3;  // 성공/취소 사유
}

// [작업사항] 신규 (PktId 35, reliable) — 클라이언트 신규 구현 필요
//   지금까지 다른 플레이어가 사라지는 경로 자체가 없었다(스폰만 있고 디스폰이 없었다).
//   같은 룸의 '나머지' 플레이어에게만 오며, 당사자는 받지 않는다
//   (당사자는 D2CNotifyRecallResult / D2CNotifyPlayerKilled 로 이미 자기 사유를 안다).
//   reason 으로 제거 연출을 나눌 것:
//     DESPAWN_RECALLED     탈출 연출 후 제거
//     DESPAWN_DEAD         사망 연출. 같은 타이밍에 D2CNotifyPlayerKilled 도 오고,
//                          시신 컨테이너가 D2CNotifySpawnObject 로 그 자리에 스폰된다.
//                          사망자 본인은 이 통보를 받지 않으므로 자기 캐릭터를 스스로
//                          치워야 한다 — 5초 유예 동안 화면에 남겨둘 것(공통 사항 (6)).
//     DESPAWN_DISCONNECTED 연출 없이 제거(끊김). 끊김 판정 기준은 공통 사항 (2) 참고.
//   이 패킷을 받은 뒤 해당 objectId 는 더 이상 D2CUpdatePlayerStates 에 나타나지 않는다.
// 플레이어가 룸에서 빠진 사유 (제거 연출 구분용)
enum DespawnReason {
    DESPAWN_UNKNOWN      = 0;
    DESPAWN_RECALLED     = 1;  // 귀환(탈출) 성공
    DESPAWN_DEAD         = 2;  // 사망
    DESPAWN_DISCONNECTED = 3;  // 연결 끊김
}

// 같은 룸의 '나머지' 플레이어에게 보내는 퇴장 통보.
// 당사자는 사유별 통보(D2CNotifyRecallResult, D2CNotifyHealthChange 등)를 이미 받으므로 제외된다.
message D2CDespawnPlayerObject {
    uint32        object_id = 1;
    DespawnReason reason    = 2;
}

// [작업사항] 신규 (PktId 39, reliable) — 클라이언트 신규 구현 필요
//   비플레이어 오브젝트가 처치 이외의 사유로 사라졌을 때 룸 전체에 온다.
//   D2CNotifySpawnObject 의 짝이며, 플레이어는 이 패킷이 아니라 D2CDespawnPlayerObject 를 쓴다.
//   처치로 인한 파괴는 이 패킷이 아니라 D2CNotifyObjectKilled(PktId 41)로 온다.
//   현재는 보내는 경로가 없다 — 컨테이너는 게임 종료까지 유지되므로, 처치 외 제거 사유가
//   생길 때를 위한 예약이다.
//   클라이언트는 해당 objectId 의 오브젝트를 제거할 것.
// 비플레이어 오브젝트의 처치 외 제거 통보 (처치는 D2CNotifyObjectKilled, 플레이어는 D2CDespawnPlayerObject)
message D2CNotifyDespawnObject {
    uint32 object_id = 1;
}

// [작업사항] 신규 (PktId 40, reliable) — 클라이언트 신규 구현 필요
//   킬 피드 UI 용이자 피해자 본인의 '사망 확정' 신호다. 플레이어가 죽는 순간
//   피해자를 포함한 룸 전체에 온다.
//   victim_object_id 가 자기 objectId 면 자기 사망이고, 이 시점부터 5초 유예가 시작된다
//   (공통 사항 (6) 참고). 사망 연출과 씬 정리 타이머의 기점으로 이 패킷을 쓸 것.
//   같은 타이밍에 시신 컨테이너가 D2CNotifySpawnObject 로 스폰되므로 피해자도 자기 시신 위치를 안다.
//   남들에게는 D2CDespawnPlayerObject(reason=DESPAWN_DEAD) 도 같이 가므로,
//   킬 피드 표기는 이 패킷, 캐릭터 제거 연출은 그쪽으로 나눠 처리할 것
//   (피해자 본인은 자기 제거 통보를 받지 않는다 — 유예 동안 화면에 남겨둬야 하기 때문이다).
//   killer_object_id 가 0xFFFFFFFF 면 가해자 없는 죽음(낙하·지역 피해 등)이다. 0 이 아니다.
//   킬러의 무기 정보는 싣지 않는다 — 통보가 사격보다 한 틱 뒤라 그 사이 무기를 바꾸면
//   틀린 값이 되기 때문이다. 무기 표기가 필요하면 클라이언트가 D2CSpawnPlayerObject.weapon_id +
//   D2CNotifyWeaponChanged 로 추적 중인 값을 쓸 것.
// 킬 피드 — 피해자를 포함한 룸 전체에 보낸다.
// 피해자에게는 사망 확정 신호를 겸하며, 이 시점부터 5초의 세션 유예가 시작된다.
// 킬러의 무기는 싣지 않는다 — 이 통보는 사격보다 한 틱 뒤라 그 사이 교체되면 틀린 값이 된다.
// 클라이언트가 D2CSpawnPlayerObject.weapon_id + D2CNotifyWeaponChanged 로 추적할 것.
message D2CNotifyPlayerKilled {
    uint32 victim_object_id = 1;
    uint32 killer_object_id = 2;  // 가해자 없음(낙하·지역 피해 등)이면 0xFFFFFFFF
}

// [작업사항] 신규 (PktId 41, reliable) — 클라이언트 신규 구현 필요
//   비플레이어 오브젝트가 처치되어 파괴됐을 때 룸 전체에 온다.
//   처치로 인한 제거는 이 패킷이 D2CNotifyDespawnObject 를 대체한다 — 이 패킷을 받으면
//   해당 victim objectId 의 오브젝트를 제거할 것.
//   피해자가 플레이어인 죽음은 이 패킷이 아니라 D2CNotifyPlayerKilled(PktId 40)로 온다.
//   killer_object_id 가 0xFFFFFFFF 면 가해자 없는 파괴다. 0 이 아니다.
//   무기 정보를 싣지 않는 이유는 D2CNotifyPlayerKilled 와 같다.
// 비플레이어 오브젝트 처치 통보 — 룸 전체에 보내며, 처치로 인한 제거 신호를 겸한다.
message D2CNotifyObjectKilled {
    uint32 victim_object_id = 1;
    uint32 killer_object_id = 2;  // 가해자 없으면 0xFFFFFFFF
}

// [작업사항] 클라이언트 미구현 — 아래 스펙대로 구현할 것.
//   3·5·6·7 번 필드를 가진 생성 코드가 남아 있다면 버리고 다시 생성할 것.
//
// 탄창 재장전. PktId 42=C2D_REQUEST_RELOAD, 43=D2C_RESPONSE_RELOAD, 둘 다 reliable.
//
// [요청]
//   탄창 잔량과 무관하게 유저 입력(R 등)으로 보낸다. 대상은 손에 든 무기이며 서버가
//   정하므로 슬롯을 실지 않는다. my_inventory_version 에는 가장 최근에 받은 값을 넣는다.
//   서버는 재장전 소요 시간을 강제하지 않고 즉시 처리한다 — 애니메이션 중 발사를 막는 것은
//   클라이언트 몫이다.
//
// [처리]
//   재장전은 인벤토리 조작의 하나이며 요청 계약은 장착·이동과 같다.
//   버전이 다르면 재장전하지 않고 거부한다. 같으면 재장전하고 인벤토리 버전을 올린다.
//
// [응답]
//   성공·거부 모두 inventory 에 처리 후의 인벤토리 전체가 실린다. 조건 없이 반영할 것.
//   result 는 재장전이 실제로 일어났는지만 알려준다.
//   버전은 inventory.inventory_version 이며 응답에 별도 버전 필드는 없다.
//   reliable 은 순서를 보장하지 않으므로, 자기가 아는 버전보다 낮은 응답은 통째로 버릴 것.
//
//   fire_sequence 는 서버가 기대하는 다음 발사 번호다. 인벤토리와 무관하며 거부에도 채워진다.
//   반드시 max(자기값, 응답값) 으로만 반영할 것 — 요청을 보낸 뒤 응답이 오기 전에 쏜 발사가
//   이미 자기 번호를 올려놨을 수 있고, 응답 값으로 되돌리면 그 발사들이 전부 '낡은 시퀀스' 로
//   거부된다. 되돌아간 클라이언트를 끌어올리는 것이 이 필드의 목적이다.
//
// [거부 처리]
//   DENY_VERSION_MISMATCH — 실린 스냅샷이 곧 재동기화다. 반영한 뒤 새 버전으로 재요청할 것.
//   DENY_SLOT_EMPTY       — 재요청해도 결과가 같다. UI 만 되돌릴 것.
//
// [클라이언트 구현 주의]
//   D2CFullInventorySync 의 수신 경로를 재사용하지 말 것. 담긴 메시지는 같아도 도착 의미가
//   다르다. 전체 동기화 핸들러에는 최초 1회용 초기화가 딸려 있고(현재 구현 기준으로 로딩
//   완료 표시와 무기 초기화), 재장전은 탄창마다 오므로 그 초기화가 전투 중 매번 돌게 된다.
//   inventory 만 꺼내 인벤토리 반영 함수에 넘길 것.
//
// [설계 의도] 아래 둘은 의도된 것이므로 '통일' 하지 말 것.
//   (1) 응답이 델타가 아니라 스냅샷인 것.
//       서버는 인벤토리를 0번부터 훑어 같은 탄종을 찾고 필요한 만큼 여러 칸에서 나눠 빼며,
//       0 이 된 칸은 비운다. 어느 칸이 몇 발씩 빠지는지가 서버의 스캔 순서에 달려 있어
//       클라이언트가 재현할 수 없다. 미러링하려면 그 로직을 복제해야 하고, 두 벌이 갈라지는
//       순간 조용히 어긋난다.
//   (2) 응답 형태가 D2CResponseEquipItem 과 다른 것.
//       장착·이동은 클라이언트가 똑같이 재현할 수 있는 단일 스왑이라 인덱스와 버전만 줘도
//       된다. 재장전은 (1) 의 이유로 그것이 성립하지 않는다.
// 탄창 재장전 요청. 대상은 손에 든 무기이며 서버가 정한다.
message C2DRequestReload {
    uint32 my_inventory_version = 1;  // 다른 인벤토리 조작과의 순서 역전 차단
}

// 재장전 결과. 성공·거부 모두 처리 후의 인벤토리 전체가 실린다.
message D2CResponseReload {
    reserved 3, 5, 6, 7;
    reserved "inventory_version", "magazine", "changed_slots", "slot";

    bool   result           = 1;  // 재장전이 실제로 일어났는지
    uint32 deny_reason_mask = 2;  // result=false 일 때만 유효
    uint32 fire_sequence    = 4;  // 서버가 기대하는 다음 발사 번호. 거부에도 max 로 반영할 것
    // 처리 후의 인벤토리 전체. 버전은 이 안에 있으며 거부에도 채워진다
    D2CFullInventorySync inventory = 8;

    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH  인벤토리 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY        손에 든 무기가 없거나, 탄창이 이미 가득 찼거나,
    //                                인벤토리에 해당 탄종이 없음
}
