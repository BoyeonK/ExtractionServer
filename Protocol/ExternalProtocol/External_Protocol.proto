syntax = "proto3";

import "External_Unity_Object.proto";

package External_Game_Protocol;
option csharp_namespace = "GameProtocol";

// ============================================================================
// [작업사항] 클라이언트 반영 대상 — 잔여 항목
//
// 이 파일의 "[작업사항]" 으로 시작하는 주석은 클라이언트 작업 지시용 임시 주석이다.
// 반영이 끝난 항목은 삭제했고, 아래 (3) 과 D2CUpdatePlayerStates 두 건만 남아 있다.
// 남은 항목도 반영이 끝나면 "[작업사항]" 블록만 삭제할 것 (그 외 주석은 유지).
//
// (3) UnityGameObject.object_type 에 값 3 = Corpse(시신 컨테이너) 가 추가되었다.
//     .proto 상 타입은 그대로 int32 지만 클라이언트의 오브젝트 타입 매핑에 3번을 추가해야 한다.
//     시신은 플레이어 사망 시 그 자리에 스폰되는 동적 오브젝트이며,
//     사망자의 인벤토리·장착·탄창이 전부 이 컨테이너로 옮겨진다.
//     스폰은 D2CNotifySpawnObject 로 통보되고, 열고 집는 조작은 일반 컨테이너와 동일하다
//     (C2DRequestOpenContainer / C2DRequestInteractContainerObject).
// ============================================================================

enum PktId {
    C2D_CHANNEL_OPEN = 0;
    D2C_RESPONSE_CHANNEL_OPEN = 1;
    C2D_HEART_BEAT = 2;
    D2C_HEART_BEAT = 3;
    C2D_REQUEST_BLUEPRINT = 4;
    D2C_RESPONSE_BLUEPRINT_STATIC_OBJECTS = 5;
    C2D_REQUEST_SPAWN_ME = 6;
    D2C_RESPONSE_SPAWN_ME_SPAWN_SPOT = 7;
    D2C_RESPONSE_SPAWN_ME_DYNAMIC_OBJECTS = 8;
    C2D_REQUEST_SPAWN_BY_OBJECT_ID = 9;
    D2C_RESPONSE_SPAWN_BY_OBJECT_ID = 10;
    C2D_UPDATE_PLAYER_STATE = 11;
    C2D_REQUEST_SPAWN_PLAYER_OBJECTS = 12;
    D2C_SPAWN_PLAYER_OBJECT = 13;
    D2C_SPAWN_PLAYER_OBJECTS = 14;
    D2C_UPDATE_PLAYER_STATES = 15;
    C2D_NOTIFY_LOADING_COMPLETE = 16;
    D2C_FULL_INVENTORY_SYNC = 17;
    C2D_REQUEST_OPEN_CONTAINER = 18;
    D2C_RESPONSE_OPEN_CONTAINER = 19;
    C2D_CLOSE_CONTAINER = 20;
    C2D_REQUEST_INTERACT_CONTAINER_OBJECT = 21;
    D2C_RESPONSE_INTERACT_CONTAINER_OBJECT = 22;
    C2D_REQUEST_EQUIP_ITEM = 23;
    D2C_RESPONSE_EQUIP_ITEM = 24;
    D2C_RESPONSE_INTERACT_CONTAINER_OBJECT_DENY = 25;
    D2C_RESPONSE_EQUIP_ITEM_DENY = 26;
    C2D_REQUEST_RECENT_INVENTORY_INFO = 27;
    D2C_RESPONSE_RECENT_CONTAINER_INFO = 28;
    C2D_REQUEST_WEAPON_FIRE = 29;
    D2C_BROADCAST_WEAPON_FIRE = 30;
    D2C_NOTIFY_HEALTH_CHANGE = 31;
    C2D_REQUEST_RECALL = 32;
    D2C_RESPONSE_RECALL = 33;
    D2C_NOTIFY_RECALL_RESULT = 34;
    D2C_DESPAWN_PLAYER_OBJECT = 35;
    D2C_NOTIFY_SPAWN_OBJECT = 36;
    D2C_NOTIFY_WEAPON_CHANGED = 37;
    C2D_REQUEST_SWITCH_WEAPON = 38;
    D2C_NOTIFY_DESPAWN_OBJECT = 39;
    D2C_NOTIFY_PLAYER_KILLED = 40;
    D2C_NOTIFY_OBJECT_KILLED = 41;
    C2D_REQUEST_RELOAD = 42;
    D2C_RESPONSE_RELOAD = 43;
}

message C2DChannelOpen {
    string echo = 1;
}

message D2CResponseChannelOpen {
    string echo = 1;
}

message C2DHeartBeat {

}

message D2CHeartBeat {

}

message C2DRequestBlueprint {
    
}

message D2CResponseBlueprintStaticObjects {
    uint32 index = 1;
    bool is_last = 2;
    repeated UnityGameObject ingame_objects = 3;
}

message C2DRequestSpawnMe {
    
}

message D2CResponseSpawnMeSpawnSpot {
    Vector3 spawn_point    = 1;
    int32   character_type = 2;
    uint32  object_id      = 3;
}

message D2CResponseSpawnMeDynamicObjects {
    uint32 index = 1;
    bool is_last = 2;
    repeated UnityGameObject ingame_objects = 3;
}

message C2DRequestSpawnByObjectId {
    int32 object_id = 1;
}

message D2CResponseSpawnByObjectId {
    UnityGameObject game_object = 1;
}

// 게임 도중 생성된 비플레이어 오브젝트의 스폰 통보 (서버 push).
// 페이로드는 D2CResponseSpawnByObjectId 와 같지만 질의 응답과 구분하려 별도 패킷으로 둔다.
message D2CNotifySpawnObject {
    UnityGameObject game_object = 1;
}

message C2DUpdatePlayerState {
    PlayerState state = 1;
}

message C2DRequestSpawnPlayerObjects {

}

// 플레이어 스폰 통보. 입장 시 일괄(D2CSpawnPlayerObjects)로도, 이후 다른 플레이어가 스폰하는
// 순간 서버 push 로도 온다(본인 제외). weapon_id 는 스폰 시점에 손에 든 무기다(0=맨손).
message D2CSpawnPlayerObject {
    int32           character_type = 1;
    UnityGameObject game_object    = 2;
    int32           weapon_id      = 3;
}

message D2CSpawnPlayerObjects {
    repeated D2CSpawnPlayerObject players = 1;
}

// [작업사항] 스펙 변경 없음 / 버그 수정 — 클라이언트 확인만 필요
//   윈체스터 맵의 룸이 이 패킷을 아예 브로드캐스트하지 않던 문제를 고쳤다.
//   테스트 맵에서만 되던 타 플레이어 이동 동기화가 이제 두 맵 모두 동일하게 동작한다.
//   실드 값은 이 패킷에 실리지 않는다(PlayerState 에 없음).
message D2CUpdatePlayerStates {
    repeated PlayerState player_states = 1;
}

message C2DNotifyLoadingComplete {

}

message D2CFullInventorySync {
    uint32              inventory_version = 1;
    repeated InventorySlot inventory_slots = 2;
    InventorySlot       primary_weapon    = 3;
    InventorySlot       secondary_weapon  = 4;
    InventorySlot       armor             = 5;
    InventorySlot       primary_weapon_magazine   = 6;
    InventorySlot       secondary_weapon_magazine = 7;
}

message C2DRequestOpenContainer {
    uint32 container_object_id = 1;
}

message D2CResponseOpenContainer {
    uint32 container_object_id = 1;
    uint32 container_version = 2;
    uint32 container_volume = 3;
    repeated InventorySlot container_slots = 4;
}

message C2DCloseContainer {

}

message C2DRequestInteractContainerObject {
    uint32 interact_type                  = 1; // 0=get, 1=swap, 2=merge
    uint32 start_object_id                = 2;
    uint32 start_object_inventory_version = 3;
    uint32 start_object_slot_idx          = 4;
    int32  quantity                        = 5;
    uint32 end_object_id                  = 6;
    uint32 end_object_inventory_version   = 7;
    uint32 end_object_slot_idx            = 8;
}

message D2CResponseInteractContainerObject {
    uint32 interact_type                  = 1; // 0=get, 1=swap, 2=merge
    uint32 start_object_id                = 2;
    uint32 start_object_inventory_version = 3;
    uint32 start_object_slot_idx          = 4;
    int32  quantity                        = 5;
    uint32 end_object_id                  = 6;
    uint32 end_object_inventory_version   = 7;
    uint32 end_object_slot_idx            = 8;
}

// 장비 슬롯 장착·해제 요청. 대상은 플레이어 인벤토리이거나 열어둔 컨테이너다.
// 무기 슬롯 조작이 성공하면 룸의 나머지에게 D2CNotifyWeaponChanged 가 함께 나간다(본인 제외).
message C2DRequestEquipItem {
    uint32 action_type                  = 1; // 0=equip, 1=unequip
    uint32 equipment_slot_type          = 2; // 0=primary_weapon, 1=secondary_weapon, 2=armor
    uint32 object_id                    = 3; // 0xFFFFFFFF=player inventory, else=container
    uint32 object_inventory_version     = 4; // object_id가 0xFFFFFFFF이면 플레이어 인벤토리 버전, 아니면 컨테이너 버전
    uint32 object_slot_idx              = 5;
    uint32 my_inventory_version         = 6; // object_id가 컨테이너일 때만 유효: 플레이어 자신의 인벤토리 버전
}

message D2CResponseEquipItem {
    uint32 action_type                = 1;
    uint32 equipment_slot_type        = 2;
    uint32 object_id                  = 3;
    uint32 object_inventory_version   = 4; // object_id가 0xFFFFFFFF이면 플레이어 인벤토리 버전, 아니면 컨테이너 버전
    uint32 object_slot_idx            = 5;
    uint32 my_inventory_version       = 6; // object_id가 컨테이너일 때만 유효: 갱신된 플레이어 인벤토리 버전
}

message D2CResponseInteractContainerObjectDeny {
    uint32 deny_reason_mask = 1;
    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH      인벤토리/컨테이너 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY            소스 슬롯이 비어 있음
    // 0x0004  DENY_SLOT_NOT_EMPTY        대상 슬롯이 비어 있지 않음 (get 타입)
    // 0x0008  DENY_SLOT_ALREADY_EMPTY    슬롯이 이미 비어 있음 (swap/merge 타입)
    // 0x0010  DENY_INVALID_QUANTITY      수량이 유효하지 않음
    // 0x0020  DENY_BLUEPRINT_MISMATCH    블루프린트 ID 불일치 (merge 타입)
    // 0x0040  DENY_ITEM_TYPE_MISMATCH    아이템 타입 불일치 (merge 타입)
    // 0x0200  DENY_SERVER_INTERNAL       서버 내부 오류
}

message D2CResponseEquipItemDeny {
    uint32 deny_reason_mask = 1;
    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH       인벤토리/컨테이너 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY             소스 슬롯이 비어 있음
    // 0x0040  DENY_ITEM_TYPE_MISMATCH     아이템 타입 불일치 (예: 장갑 슬롯에 무기)
    // 0x0080  DENY_BARE_HANDED            마지막 무기를 내릴 수 없음 (맨손 방지)
    // 0x0100  DENY_MAGAZINE_UNLOAD_FAILED 탄창 언로드 실패
    // 0x0200  DENY_SERVER_INTERNAL        서버 내부 오류
}

// 손에 든 무기 변경 통보. 남의 변경은 당사자를 제외한 룸 전체에, 본인의 교체 결과는 본인에게 온다.
// 방어구는 싣지 않는다 — 외형에 드러나지 않고, blueprint_id 하나가 ArmorSpec 전체와 동치라 수치 노출이 된다.
message D2CNotifyWeaponChanged {
    uint32 object_id         = 1;
    uint32 weapon_id         = 2;  // 손에 든 무기 blueprint_id (0=맨손). D2CSpawnPlayerObject.weapon_id 와 같은 의미
    uint32 slot              = 3;  // 손에 든 슬롯 (0=주무기, 1=보조무기). 주/보조가 같은 무기면 weapon_id 로는 구분되지 않는다
    // 서버가 보는 수신자 본인의 인벤토리 버전. 남의 변경 통보에는 0xFFFFFFFF 가 온다 —
    // 0 은 실재하는 버전이므로(세션 시작값) '미설정' 으로 해석하면 안 된다
    uint32 inventory_version = 4;
}

message C2DRequestRecentInventoryInfo {
    uint32 object_id = 1; // 0xFFFFFFFF=player inventory, else=container
}

message D2CResponseRecentContainerInfo {
    uint32 container_object_id = 1;
    uint32 container_version = 2;
    uint32 container_volume = 3;
    repeated InventorySlot container_slots = 4;
}

// 손에 드는 무기 교체. 토글이 아니라 절대 지정이라 재전송·순서 역전에도 결과가 같다.
// 결과는 성공·거부 모두 D2CNotifyWeaponChanged 로 돌아온다 (거부는 요청자에게만).
message C2DRequestSwitchWeapon {
    uint32 target_slot          = 1;  // 0=주무기, 1=보조무기
    uint32 my_inventory_version = 2;  // 장착 조작과의 순서 역전 차단
}

// 발사 요청. 피격 대상은 플레이어와 HP 를 가진 비플레이어 오브젝트 전부다.
// weapon_dbid 는 '장착한' 무기가 아니라 '손에 든' 무기여야 하며, 불일치 시 발사는 조용히 무시된다.
message C2DRequestWeaponFire {
    // 단조 증가하기만 하면 되고 연속일 필요는 없다. 되돌아온 값은 리플레이로 간주해 거부된다
    uint32  fire_sequence  = 1;  // 발사 시퀀스 번호
    uint32  weapon_dbid    = 2;  // 손에 든 총기의 blueprint_id
    Vector3 hit_point      = 3;  // Raycast 피격 좌표 (빗나간 경우 미설정)
    uint32  hit_object_id  = 4;  // 피격 대상 object_id (없으면 0xFFFFFFFF)
}

message D2CBroadcastWeaponFire {
    uint32  shooter_object_id = 1;  // 발사자 object_id
    Vector3 hit_point         = 2;  // 탄착 좌표 (없으면 미설정 — 이펙트 불필요)
}

enum HealthChangeReason {
    REASON_UNKNOWN    = 0;
    REASON_WEAPON_HIT = 1;  // 총기 피격
    REASON_ITEM_HEAL  = 2;  // 아이템 회복
}

// HP·실드 변화 통보. 피해를 입은 본인에게만 오며, 실드 재생으로는 발생하지 않는다.
message D2CNotifyHealthChange {
    int32              health_point       = 1;  // 현재 HP (절대값)
    int32              shield_point       = 2;  // 현재 쉴드 (절대값)
    HealthChangeReason reason             = 3;  // 변화 원인
    // 가해자 object_id. 가해자가 없으면(회복 등) 0xFFFFFFFF 를 반드시 명시할 것 —
    // proto3 기본값 0 은 실재하는 object_id 라 미설정이 곧 오귀속이 된다
    uint32             attacker_object_id = 4;
}

// 귀환 시작 요청. D2CResponseRecall 의 result=true 는 '완료' 가 아니라 '승인' 이며,
// 최종 결과는 D2CNotifyRecallResult 로 따로 온다. 진행 중 재요청은 서버가 조용히 무시한다.
message C2DRequestRecall {
    uint32 recall_spot_index = 1;  // 귀환 스팟 인덱스 (맵별 귀환 영역 테이블의 인덱스)
}

message D2CResponseRecall {
    bool   result            = 1;  // true=귀환 승인, false=거부
    uint32 recall_spot_index = 2;  // 요청 인덱스 에코 (어느 요청에 대한 응답인지 대조용)
}

// 귀환 승인 후 진행(1초 간격 5회 검사)의 최종 결과 사유
enum RecallResultReason {
    RECALL_RESULT_UNKNOWN         = 0;
    RECALL_RESULT_SUCCESS         = 1;  // 5회 검사 전부 통과 — 귀환 성공
    RECALL_RESULT_OUT_OF_ZONE     = 2;  // 진행 중 귀환 영역 이탈
    RECALL_RESULT_PLAYER_DEAD     = 3;  // 진행 중 사망
    RECALL_RESULT_SESSION_LOST    = 4;  // 세션이 INPLAY 상태를 벗어남
    RECALL_RESULT_SERVER_INTERNAL = 5;  // 룸/오브젝트 조회 실패 등 서버 내부 오류
}

// D2CResponseRecall(result=true) 로 승인된 귀환의 최종 결과 통보.
// 승인 시점부터 5초 뒤(1초 간격 5회 검사 통과)에 성공이, 검사 실패 시점에 취소가 전송된다.
message D2CNotifyRecallResult {
    bool               result            = 1;  // true=귀환 성공, false=귀환 취소
    uint32             recall_spot_index = 2;  // 요청 인덱스 에코 (어느 요청에 대한 결과인지 대조용)
    RecallResultReason reason            = 3;  // 성공/취소 사유
}

// 플레이어가 룸에서 빠진 사유 (제거 연출 구분용)
enum DespawnReason {
    DESPAWN_UNKNOWN      = 0;
    DESPAWN_RECALLED     = 1;  // 귀환(탈출) 성공
    DESPAWN_DEAD         = 2;  // 사망
    DESPAWN_DISCONNECTED = 3;  // 연결 끊김
}

// 같은 룸의 '나머지' 플레이어에게 보내는 퇴장 통보.
// 당사자는 사유별 통보(D2CNotifyRecallResult, D2CNotifyHealthChange 등)를 이미 받으므로 제외된다.
message D2CDespawnPlayerObject {
    uint32        object_id = 1;
    DespawnReason reason    = 2;
}

// 비플레이어 오브젝트의 처치 외 제거 통보 (처치는 D2CNotifyObjectKilled, 플레이어는 D2CDespawnPlayerObject)
message D2CNotifyDespawnObject {
    uint32 object_id = 1;
}

// 킬 피드 — 피해자를 포함한 룸 전체에 보낸다. 피해자에게는 사망 확정 신호를 겸한다.
// 킬러의 무기는 싣지 않는다 — 이 통보는 사격보다 한 틱 뒤라 그 사이 교체되면 틀린 값이 된다.
message D2CNotifyPlayerKilled {
    uint32 victim_object_id = 1;
    uint32 killer_object_id = 2;  // 가해자 없음(낙하·지역 피해 등)이면 0xFFFFFFFF
}

// 비플레이어 오브젝트 처치 통보 — 룸 전체에 보내며, 처치로 인한 제거 신호를 겸한다.
message D2CNotifyObjectKilled {
    uint32 victim_object_id = 1;
    uint32 killer_object_id = 2;  // 가해자 없으면 0xFFFFFFFF
}

// 탄창 재장전 요청. 대상은 손에 든 무기이며 서버가 정한다.
message C2DRequestReload {
    uint32 my_inventory_version = 1;  // 다른 인벤토리 조작과의 순서 역전 차단
}

// 재장전 결과. 성공·거부 모두 처리 후의 인벤토리 전체가 실린다.
message D2CResponseReload {
    reserved 3, 5, 6, 7;
    reserved "inventory_version", "magazine", "changed_slots", "slot";

    bool   result           = 1;  // 재장전이 실제로 일어났는지
    uint32 deny_reason_mask = 2;  // result=false 일 때만 유효
    uint32 fire_sequence    = 4;  // 서버가 기대하는 다음 발사 번호. 거부 응답에도 채워진다
    // 처리 후의 인벤토리 전체. 버전은 이 안에 있으며 거부에도 채워진다
    D2CFullInventorySync inventory = 8;

    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH  인벤토리 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY        손에 든 무기가 없거나, 탄창이 이미 가득 찼거나,
    //                                인벤토리에 해당 탄종이 없음
}
