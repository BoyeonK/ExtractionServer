syntax = "proto3";

import "External_Unity_Object.proto";

package External_Game_Protocol;
option csharp_namespace = "GameProtocol";

enum PktId {
    C2D_CHANNEL_OPEN = 0;
    D2C_RESPONSE_CHANNEL_OPEN = 1;
    C2D_HEART_BEAT = 2;
    D2C_HEART_BEAT = 3;
    C2D_REQUEST_BLUEPRINT = 4;
    D2C_RESPONSE_BLUEPRINT_STATIC_OBJECTS = 5;
    C2D_REQUEST_SPAWN_ME = 6;
    D2C_RESPONSE_SPAWN_ME_SPAWN_SPOT = 7;
    D2C_RESPONSE_SPAWN_ME_DYNAMIC_OBJECTS = 8;
    C2D_REQUEST_SPAWN_BY_OBJECT_ID = 9;
    D2C_RESPONSE_SPAWN_BY_OBJECT_ID = 10;
    C2D_UPDATE_PLAYER_STATE = 11;
    C2D_REQUEST_SPAWN_PLAYER_OBJECTS = 12;
    D2C_SPAWN_PLAYER_OBJECT = 13;
    D2C_SPAWN_PLAYER_OBJECTS = 14;
    D2C_UPDATE_PLAYER_STATES = 15;
    C2D_NOTIFY_LOADING_COMPLETE = 16;
    D2C_FULL_INVENTORY_SYNC = 17;
    C2D_REQUEST_OPEN_CONTAINER = 18;
    D2C_RESPONSE_OPEN_CONTAINER = 19;
    C2D_CLOSE_CONTAINER = 20;
    C2D_REQUEST_INTERACT_CONTAINER_OBJECT = 21;
    D2C_RESPONSE_INTERACT_CONTAINER_OBJECT = 22;
    C2D_REQUEST_EQUIP_ITEM = 23;
    D2C_RESPONSE_EQUIP_ITEM = 24;
    D2C_RESPONSE_INTERACT_CONTAINER_OBJECT_DENY = 25;
    D2C_RESPONSE_EQUIP_ITEM_DENY = 26;
}

message C2DChannelOpen {
    string echo = 1;
}

message D2CResponseChannelOpen {
    string echo = 1;
}

message C2DHeartBeat {

}

message D2CHeartBeat {

}

message C2DRequestBlueprint {
    
}

message D2CResponseBlueprintStaticObjects {
    uint32 index = 1;
    bool is_last = 2;
    repeated UnityGameObject ingame_objects = 3;
}

message C2DRequestSpawnMe {
    
}

message D2CResponseSpawnMeSpawnSpot {
    Vector3 spawn_point    = 1;
    int32   character_type = 2;
    uint32  object_id      = 3;
}

message D2CResponseSpawnMeDynamicObjects {
    uint32 index = 1;
    bool is_last = 2;
    repeated UnityGameObject ingame_objects = 3;
}

message C2DRequestSpawnByObjectId {
    int32 object_id = 1;
}

message D2CResponseSpawnByObjectId {
    UnityGameObject game_object = 1;
}

message C2DUpdatePlayerState {
    PlayerState state = 1;
}

message C2DRequestSpawnPlayerObjects {

}

message D2CSpawnPlayerObject {
    int32           character_type = 1;
    UnityGameObject game_object    = 2;
    int32           weapon_id      = 3;
}

message D2CSpawnPlayerObjects {
    repeated D2CSpawnPlayerObject players = 1;
}

message D2CUpdatePlayerStates {
    repeated PlayerState player_states = 1;
}

message C2DNotifyLoadingComplete {

}

message D2CFullInventorySync {
    uint32              inventory_version = 1;
    repeated InventorySlot inventory_slots = 2;
    InventorySlot       primary_weapon    = 3;
    InventorySlot       secondary_weapon  = 4;
    InventorySlot       armor             = 5;
    InventorySlot       primary_weapon_magazine   = 6;
    InventorySlot       secondary_weapon_magazine = 7;
}

message C2DRequestOpenContainer {
    uint32 container_object_id = 1;
}

message D2CResponseOpenContainer {
    uint32 container_object_id = 1;
    uint32 container_version = 2;
    uint32 container_volume = 3;
    repeated InventorySlot container_slots = 4;
}

message C2DCloseContainer {

}

message C2DRequestInteractContainerObject {
    uint32 interact_type                  = 1; // 0=get, 1=swap, 2=merge
    uint32 start_object_id                = 2;
    uint32 start_object_inventory_version = 3;
    uint32 start_object_slot_idx          = 4;
    int32  quantity                        = 5;
    uint32 end_object_id                  = 6;
    uint32 end_object_inventory_version   = 7;
    uint32 end_object_slot_idx            = 8;
}

message D2CResponseInteractContainerObject {
    uint32 interact_type                  = 1; // 0=get, 1=swap, 2=merge
    uint32 start_object_id                = 2;
    uint32 start_object_inventory_version = 3;
    uint32 start_object_slot_idx          = 4;
    int32  quantity                        = 5;
    uint32 end_object_id                  = 6;
    uint32 end_object_inventory_version   = 7;
    uint32 end_object_slot_idx            = 8;
}

message C2DRequestEquipItem {
    uint32 action_type                  = 1; // 0=equip, 1=unequip
    uint32 equipment_slot_type          = 2; // 0=primary_weapon, 1=secondary_weapon, 2=armor
    uint32 object_id                    = 3; // 0xFFFFFFFF=player inventory, else=container
    uint32 object_inventory_version     = 4; // object_id가 0xFFFFFFFF이면 플레이어 인벤토리 버전, 아니면 컨테이너 버전
    uint32 object_slot_idx              = 5;
    uint32 my_inventory_version         = 6; // object_id가 컨테이너일 때만 유효: 플레이어 자신의 인벤토리 버전
}

message D2CResponseEquipItem {
    uint32 action_type                = 1;
    uint32 equipment_slot_type        = 2;
    uint32 object_id                  = 3;
    uint32 object_inventory_version   = 4; // object_id가 0xFFFFFFFF이면 플레이어 인벤토리 버전, 아니면 컨테이너 버전
    uint32 object_slot_idx            = 5;
    uint32 my_inventory_version       = 6; // object_id가 컨테이너일 때만 유효: 갱신된 플레이어 인벤토리 버전
}

message D2CResponseInteractContainerObjectDeny {
    uint32 deny_reason_mask = 1;
    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH      인벤토리/컨테이너 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY            소스 슬롯이 비어 있음
    // 0x0004  DENY_SLOT_NOT_EMPTY        대상 슬롯이 비어 있지 않음 (get 타입)
    // 0x0008  DENY_SLOT_ALREADY_EMPTY    슬롯이 이미 비어 있음 (swap/merge 타입)
    // 0x0010  DENY_INVALID_QUANTITY      수량이 유효하지 않음
    // 0x0020  DENY_BLUEPRINT_MISMATCH    블루프린트 ID 불일치 (merge 타입)
    // 0x0040  DENY_ITEM_TYPE_MISMATCH    아이템 타입 불일치 (merge 타입)
    // 0x0200  DENY_SERVER_INTERNAL       서버 내부 오류
}

message D2CResponseEquipItemDeny {
    uint32 deny_reason_mask = 1;
    // 비트필드 마스킹된 거부 사유 (복수 비트 OR 가능)
    // 0x0001  DENY_VERSION_MISMATCH       인벤토리/컨테이너 버전이 클라이언트와 다름
    // 0x0002  DENY_SLOT_EMPTY             소스 슬롯이 비어 있음
    // 0x0040  DENY_ITEM_TYPE_MISMATCH     아이템 타입 불일치 (예: 장갑 슬롯에 무기)
    // 0x0080  DENY_BARE_HANDED            마지막 무기를 내릴 수 없음 (맨손 방지)
    // 0x0100  DENY_MAGAZINE_UNLOAD_FAILED 탄창 언로드 실패
    // 0x0200  DENY_SERVER_INTERNAL        서버 내부 오류
}