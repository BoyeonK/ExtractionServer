syntax = "proto3";

package IPC_Protocol;

message D2MInitComplete {
    int32 pid = 1;
}

message ItemSlot {
    uint32 item_id    = 1;   // blueprintId (JSON: itemId)
    int32  slot_index = 2;   // 0–24 for inventory, 0–2 for equipment
    int32  quantity   = 3;
}

message PlayerInfo {
    string ticket_id   = 1;
    int32  uid         = 2;
    string user_id     = 3;
    int32  rating      = 4;
    repeated ItemSlot inventory_items = 5;
    repeated ItemSlot equipment_items = 6;
    int32  character_type = 7;
}

message M2DMakeRoomForThisGroup {
    int32 map_id = 1;
    repeated PlayerInfo player_infos = 2;
}

message D2MUpdateEntryToken {
    int32 size = 1;
    int32 port = 2;

    repeated string ticket_ids = 3;
    repeated int32 session_ids = 4;
    repeated string entry_tokens = 5;
    repeated int32 security_keys = 6;
}

// PlayerSession::LeaveReason 과 값이 일치해야 한다 (static_assert 로 검증).
enum LeaveReason {
    LEAVE_NONE         = 0;
    LEAVE_RECALLED     = 1;
    LEAVE_DEAD         = 2;
    LEAVE_DISCONNECTED = 3;
}

// 이탈 확정 통보. Dedicate 는 DB·Redis 를 직접 다루지 않으므로 Main 이 대신 처리한다.
//
// 슬롯은 M2DMakeRoomForThisGroup 의 PlayerInfo 와 같은 분할·인덱스를 쓴다 (입장/퇴장 대칭).
// LEAVE_RECALLED 일 때만 채운다 — 사망·연결 끊김은 빈손이라 비워 보낸다.
// uid 가 음수면 게스트다. users 테이블에 행이 없어 DB 반영 대상이 아니다.
message D2MNotifyPlayerLeft {
    int32       uid          = 1;
    LeaveReason leave_reason = 2;
    repeated ItemSlot inventory_slots = 3;   // slot_index 0–24
    repeated ItemSlot equipment_slots = 4;   // slot_index 0=주무기 1=보조무기 2=방어구
}

