syntax = "proto3";

package IPC_Protocol;

message D2MInitComplete {
    int32 pid = 1;
}

message ItemSlot {
    uint32 item_id    = 1;   // blueprintId (JSON: itemId)
    int32  slot_index = 2;   // 0–24 for inventory, 0–2 for equipment
    int32  quantity   = 3;
}

message PlayerInfo {
    string ticket_id   = 1;
    int32  uid         = 2;
    string user_id     = 3;
    int32  rating      = 4;
    repeated ItemSlot inventory_items = 5;
    repeated ItemSlot equipment_items = 6;
    int32  character_type = 7;
}

message M2DMakeRoomForThisGroup {
    int32 map_id = 1;
    repeated PlayerInfo player_infos = 2;
}

message D2MUpdateEntryToken {
    int32 size = 1;
    int32 port = 2;

    repeated string ticket_ids = 3;
    repeated int32 session_ids = 4;
    repeated string entry_tokens = 5;
    repeated int32 security_keys = 6;
}

